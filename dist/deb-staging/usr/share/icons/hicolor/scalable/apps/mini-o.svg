<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#0f0f17"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <!-- Robot/Brain Core -->
  <circle cx="64" cy="64" r="32" fill="none" stroke="url(#glowGrad)" stroke-width="6"/>
  <circle cx="64" cy="64" r="16" fill="url(#glowGrad)"/>
  <!-- Orbiting Satellite Nodes -->
  <circle cx="64" cy="20" r="6" fill="#818cf8"/>
  <circle cx="108" cy="64" r="6" fill="#a78bfa"/>
  <circle cx="64" cy="108" r="6" fill="#f472b6"/>
  <circle cx="20" cy="64" r="6" fill="#38bdf8"/>
  <!-- Connecting Links -->
  <line x1="64" y1="26" x2="64" y2="32" stroke="#818cf8" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="102" y1="64" x2="96" y2="64" stroke="#a78bfa" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="64" y1="102" x2="64" y2="96" stroke="#f472b6" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="26" y1="64" x2="32" y2="64" stroke="#38bdf8" stroke-width="2" stroke-dasharray="2,2"/>
</svg>
