name: Mini-O release artifact

on:
  push:
    tags: ['v*.*.*']

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/release.sh "${GITHUB_REF_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: mini-o-${{ github.ref_name }}
          path: mini-o-*.tar.gz
